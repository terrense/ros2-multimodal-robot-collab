; Python-side tests (agent_env + training). The ROS2 packages under src/ are
; tested by colcon, not by pytest -- keep the two runners apart.
;
; Config lives in pytest.ini rather than pyproject.toml so colcon never mistakes
; the repository root for a buildable Python package.
[pytest]
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
