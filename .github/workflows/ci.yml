name: CI

# The gate. If this is green on a branch, the branch is mergeable.
#
#   lint           ~20s   ruff + conflict markers        (every push)
#   python-tests   ~40s   505 tests, benchmark, results table, acceptance run
#   harness-tests  ~25s   agent_harness suite (pytest.ini testpaths hides it)
#   ros2-build     ~7min  10 colcon packages inside ros:humble-ros-base, the
#                         ROS-only runtime tests, and a headless simulation
#                         smoke test
#                         (only when src/, scripts/, skills/ or the Dockerfile changed)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless: cancel it.
# Without this, five quick fix-up commits burn five full ROS2 builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflows only read the repository. Grant nothing you do not need.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------- routing
  # Cheap router that decides whether the expensive ROS2 job is worth its
  # minutes. A README edit or a docstring fix in training/ must not rebuild
  # ten colcon packages.
  changes:
    runs-on: ubuntu-22.04
    outputs:
      ros: ${{ steps.filter.outputs.ros }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ros:
              - 'src/**'
              - 'scripts/**'
              - 'skills/**'
              - 'agent_harness/**'
              - 'Dockerfile'
              - '.github/workflows/**'

  # ------------------------------------------------------------------ fast
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Lint (ruff)
        run: ruff check .
      - name: Reject leftover merge conflict markers
        # Succeeds only when git grep finds nothing; third_party/ is vendored
        # and full of legitimate '=======' markdown underlines.
        run: "! git grep -n -E '^(<<<<<<< |>>>>>>> )' -- ':!third_party'"

  python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests (agent_env + training)
        run: python -m pytest
      - name: Frozen benchmark still matches its generator
        run: python -m training.data.build_benchmark --check
      - name: Published results table matches the committed artifacts
        # docs/results.md mixes hand-written prose with generated tables. This
        # regenerates the tables from results/ and fails if the document has
        # drifted, so a number can never be edited by hand behind the report's
        # back.
        run: python -m training.report --verify docs/results.md
      - name: Environment acceptance (expert must recover from every fault)
        run: python -m agent_env.scripts.collect_trajectories --acceptance --out /tmp/l1_acceptance.jsonl

  harness-tests:
    # pytest.ini pins testpaths = tests, so the job above never reaches
    # agent_harness/tests. These need no ROS2 and no numpy, so run them apart.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run agent harness tests (no ROS2 required)
        run: pytest agent_harness/tests -q

  # ------------------------------------------------------------------ slow
  ros2-build:
    # The previous version of this job hand-rolled `apt install ros-humble-*`
    # without adding packages.ros.org, so it failed on every single run and
    # ten ROS2 packages never got a build check. Use the official image: the
    # toolchain is someone else's maintenance problem now.
    needs: changes
    if: needs.changes.outputs.ros == 'true'
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - name: Mark the workspace safe for git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Install colcon and rosdep
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep
      - name: Resolve package dependencies
        run: |
          [ -f /etc/ros/rosdep/sources.list.d/20-default.list ] || rosdep init
          rosdep update --rosdistro humble
          # ament_python is a build type, not a dependency: rosdep has no rule
          # for it (ament_cmake does), so every Python package fails resolution
          # unless the key is skipped explicitly.
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys ament_python
      - name: Build workspace
        # Only src/. third_party/ holds vendored source snapshots (Ultralytics,
        # VINS-Mono, OpenPose) that are not colcon packages of this workspace.
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths src --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Runtime tests that need ROS 2
        # The concurrency work is only half testable without a ROS 2 install:
        # the other half needs a real MultiThreadedExecutor, real callback
        # groups and a real action server. It skips where rclpy is absent, so
        # it runs here and nowhere else.
        run: |
          apt-get install -y --no-install-recommends python3-pytest
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest agent_harness/tests/test_concurrency_ros.py -q
      - name: Test workspace
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --base-paths src --event-handlers console_direct+
          colcon test-result --verbose

      - name: Simulation smoke test (headless)
        # The three defects found on 2026-11-11 -- a capability missing from the
        # registry, a timeout computed and discarded, a probe measuring a tool
        # that did not exist -- were invisible to every test in the suite. All
        # three needed a running stack. This starts gzserver with no window and
        # drives one real delivery through the runtime, so that class of defect
        # lands here instead of on a person's machine.
        #
        # It is not a substitute for the ROS test suite: it checks that the
        # graph comes up and that a plan can be dispatched against it.
        timeout-minutes: 12
        run: |
          set -o pipefail
          export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
          apt-get install -y --no-install-recommends \
            ros-humble-rmw-cyclonedds-cpp iproute2 procps \
            libgl1-mesa-dri libgl1-mesa-glx libglu1-mesa
          source /opt/ros/humble/setup.bash
          source install/setup.bash

          # No display anywhere: this is the CI condition, and the stack has to
          # work in it. Gazebo still needs a GL driver for its scene graph, so
          # the software renderer is what makes the container able to run it.
          unset DISPLAY WAYLAND_DISPLAY
          export LIBGL_ALWAYS_SOFTWARE=1
          # The model database is online; a runner with no route to it would
          # stall the world load.
          export GAZEBO_MODEL_DATABASE_URI=""

          bash scripts/run_gazebo_demo.sh --headless

          # 40s was enough locally; CI runners are slower.
          UP=0
          for i in $(seq 1 60); do
            if timeout 15 python3 scripts/ros_graph.py wait /mission/deliver_tool 5 >/dev/null 2>&1; then
              echo "stack answered after ${i} attempt(s)"
              UP=1
              break
            fi
            sleep 3
          done
          if [ "$UP" != "1" ]; then
            echo "the stack never came up; the launch log follows"
            tail -80 /tmp/gazebo_demo.log || true
            exit 1
          fi

          echo "=== nodes ==="
          timeout 30 python3 scripts/ros_graph.py nodes | sort

          echo "=== runtime smoke ==="
          EXEC_TIMEOUT_SEC=60 RUN_TIMEOUT_SEC=240 \
            SMOKE_USE_RUNNING=1 bash scripts/smoke_ros2_runtime.sh /tmp/ci_smoke.db

      - name: Stop the simulation
        if: always()
        run: bash scripts/stop_gazebo_demo.sh || true

      - name: Simulation logs on failure
        if: failure()
        run: |
          echo "=== launch log (last 120 lines) ==="
          tail -120 /tmp/gazebo_demo.log 2>/dev/null || echo "(no log)"
          echo "=== gzserver output ==="
          tail -40 /tmp/gzserver.log 2>/dev/null || true
