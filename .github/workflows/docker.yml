name: Container

# CD for this repository is a reproducible runtime image, not an SSH deploy.
# Any machine that can run Docker gets the exact workspace CI built -- same
# Humble base, same rosdep resolution, same colcon output.
#
#   push to main   -> :edge, :sha-<short>
#   tag v1.2.3     -> :1.2.3, :1.2, :sha-<short>
#
# First push may need the package made public:
#   GitHub > your profile > Packages > the package > Package settings > Change visibility
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN is minted per run and never leaves the runner. No PAT
          # to rotate, no secret to leak.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, so an unchanged rosdep
          # layer is not rebuilt on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image we just pushed
        # A green build only proves it compiled. This proves the overlay is
        # sourced by the entrypoint and the packages are registered -- with no
        # `bash -lc` and no explicit `source`, i.e. exactly how a user runs it.
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "smoke testing $IMAGE"
          docker run --rm "$IMAGE" ros2 pkg list | grep -c robot_collab
